services:
  - type: web
    name: legend-market-dashboard
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FYERS_APP_ID
        sync: false
      - key: FYERS_SECRET_ID
        sync: false
      - key: FYERS_REDIRECT_URI
        sync: false
      - key: FYERS_NIFTY_SYMBOL
        sync: false
      - key: FYERS_SENSEX_SYMBOL
        sync: false
      - key: LEGEND_CAPTURE_TOKEN
        sync: false
